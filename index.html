<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealNoobasik228's shop — Каталог NFT Подарков Telegram</title>
<style>
:root{--bg:#0c0a12;--card:#14121d;--inp:#171422;--hov:#1e1a2d;--brd:#262236;--purp:#8b5cf6;--pink:#f43f5e;--cyan:#38bdf8;--txt:#f8fafc;--mut:#8b869e}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:0 20px 50px;min-height:100vh}
.container{max-width:1240px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff;text-decoration:none}
.brand-dot{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#7c3aed);box-shadow:0 0 12px rgba(139,92,246,.6)}
.top-links{display:flex;align-items:center;gap:20px;font-size:14px}
.top-links a,.top-links button{background:none;border:none;color:var(--mut);cursor:pointer;text-decoration:none;font-size:14px;padding:0}
.top-links a:hover,.top-links button:hover{color:#fff}
.top-links a.msg-link{color:#c4b5fd;text-decoration:underline;text-underline-offset:4px}
.seller-banner{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.seller-left{display:flex;align-items:center;gap:16px}
.avatar-wrap{position:relative;width:64px;height:64px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;border:2px solid #2e2942}
.online-dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;background:#22c55e;border-radius:50%;border:2.5px solid var(--bg)}
.seller-name{font-size:24px;font-weight:800;margin:0 0 6px}
.seller-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.status-online{color:#22c55e;font-weight:600}
.rating-star{color:#fbbf24;font-weight:700}
.seller-stats{display:flex;gap:32px;text-align:right}
.stat-label{font-size:12px;color:var(--mut);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:800}
.tabs-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab-btn{background:var(--card);border:1px solid var(--brd);color:var(--mut);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.tab-btn:hover{background:var(--hov);color:#fff}
.tab-btn.active-all{background:rgba(139,92,246,.14);border-color:var(--purp);color:#fff}
.tab-btn.active-mono{background:rgba(56,189,248,.14);border-color:var(--cyan);color:#fff}
.tab-btn.active-fav{background:rgba(244,63,94,.14);border-color:var(--pink);color:#fff}
.filter-box{background:var(--card);border:1px solid var(--brd);border-radius:18px;padding:14px;margin-bottom:22px}
.filter-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill-select{background:var(--inp);border:1px solid var(--brd);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;outline:none}
.pill-select:hover,.pill-select:focus{border-color:var(--purp)}
.reload-icon-btn{width:34px;height:34px;border-radius:50%;background:var(--inp);border:1px solid var(--brd);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.reload-icon-btn:hover{color:#fff;border-color:var(--purp)}
.filter-bottom{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-wrap{flex-grow:1;min-width:240px}
.search-input{width:100%;background:var(--inp);border:1px solid var(--brd);color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;outline:none}
.search-input:focus{border-color:var(--purp)}
.price-range{display:flex;align-items:center;gap:8px;background:var(--inp);border:1px solid var(--brd);padding:6px 14px;border-radius:999px;font-size:13px;color:var(--mut)}
.price-range input{width:64px;background:transparent;border:none;color:#fff;font-size:13px;text-align:center;outline:none}
.sort-select{background:var(--inp);border:1px solid var(--brd);color:#fff;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;outline:none}
.mono-panel{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px;margin-bottom:22px;display:none}
.mono-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.color-chips{display:flex;flex-wrap:wrap;gap:8px}
.color-chip{background:var(--inp);border:1px solid var(--brd);color:var(--txt);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.color-chip.active{border-color:var(--cyan);background:rgba(56,189,248,.14)}
.dot-c{width:9px;height:9px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:#3d3659}
.card-visual{height:195px;position:relative;display:flex;align-items:center;justify-content:center;margin:8px 8px 0;border-radius:14px;overflow:hidden}
.card-visual img{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));transition:.2s}
.card:hover .card-visual img{transform:scale(1.05)}
.mono-tag{position:absolute;top:10px;left:10px;background:rgba(15,13,24,.75);backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.fav-btn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(15,13,24,.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.fav-btn.is-fav{color:var(--pink);border-color:rgba(244,63,94,.4)}
.card-body{padding:14px;display:flex;flex-direction:column;flex-grow:1}
.card-title{font-size:15px;font-weight:700;margin-bottom:3px;color:#fff}
.card-sub{font-size:12px;color:var(--mut);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-btn{margin-top:auto;width:100%;background:#1c1829;border:1px solid #2b2540;color:#fff;padding:10px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.price-btn:hover{background:var(--purp);border-color:var(--purp)}
.empty-state{text-align:center;padding:60px 20px;display:none}
.empty-heart{font-size:46px;margin-bottom:14px}
.empty-title{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--mut);max-width:340px;margin:0 auto 20px;line-height:1.5}
.back-red-btn{background:var(--pink);color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.status-msg{text-align:center;padding:40px;color:var(--mut);font-size:15px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--brd);border-radius:18px;max-width:440px;width:100%;padding:24px}
.modal h3{margin:0 0 10px;font-size:18px}
.modal p{color:var(--mut);font-size:14px;line-height:1.5;margin:0 0 18px}
</style>
</head>
<body>
<div class="container">
<div class="topbar">
<a href="#" class="brand" onclick="switchTab('all');return false"><span class="brand-dot"></span><span>RealNoobasik228's shop</span></a>
<div class="top-links">
<button onclick="document.getElementById('aboutModal').style.display='flex'">О сайте</button>
<a href="https://funpay.com" target="_blank" class="msg-link" id="topSellerLink">Написать продавцу</a>
</div>
</div>
<div class="seller-banner">
<div class="seller-left">
<div class="avatar-wrap"><div class="avatar">R</div><span class="online-dot"></span></div>
<div>
<h1 class="seller-name">RealNoobasik228</h1>
<div class="seller-meta"><span class="status-online">Онлайн</span><span class="rating-star">★ 5,0 из 5,0</span><span>55 отзывов на FunPay</span></div>

</div>
<div class="seller-stats">

</div>
</div>
<div class="tabs-row">
<button class="tab-btn active-all" id="tabAll" onclick="switchTab('all')">⊞ Все подарки</button>
<button class="tab-btn" id="tabMono" onclick="switchTab('mono')">💎 Монохромные</button>

</div>
